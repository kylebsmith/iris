name: ci

# The whole test suite is one command with no dependencies, so CI is cheap and
# there is no excuse for the determinism contract to rot silently.
on: [push, pull_request]

jobs:
  audit:
    name: audit (${{ matrix.os }} / ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      # The `sketches` arm below compares the students' ten copies of iris.h
      # against this one. Without this second checkout it had nothing to
      # compare and printed SKIP, so the step could only ever pass -- which is
      # exactly the failure it was written to catch.
      # continue-on-error is NOT a way to let this pass quietly. If the checkout
      # fails, IRIS_STARTER below points at a directory that does not exist and
      # `build.sh sketches` exits 1 under CI with a sentence saying why. The
      # difference is WHERE the failure lands: without this, the job dies at
      # step 2 on a raw git error before a single test runs. With it, the job
      # fails at the check that actually cares, with a message a person can act
      # on. Publish iris-esp32-starter before iris and neither happens.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: kylebsmith/iris-starter
          path: _starter
      - name: audit, mpe, sinks
        run: |
          export CC=${{ matrix.cc }}
          export IRIS_STARTER="$GITHUB_WORKSPACE/_starter"
          sh build.sh audit
          sh build.sh mpe
          sh build.sh sinks
          sh build.sh claims
          sh build.sh bloat
          sh build.sh coverage
          sh build.sh sketches
          sh build.sh tu
          # regressions is one test per reviewed defect, each written before its
          # fix; fuzz is the only arm that encodes none of our expectations and
          # lets AddressSanitizer decide. Neither was run here, so the net
          # against reintroducing 21 specific fixed defects was the one net CI
          # did not hold.
          sh build.sh regressions
          sh build.sh fuzz

  # The library claims zero external symbols. That claim is checkable in one
  # command, so check it on every push rather than asserting it in a README.
  freestanding:
    name: zero external symbols
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This job used to carry its OWN copy of the probe, and the copy drifted:
      # tools/check-claims.sh compiles with -fno-math-errno and
      # -fno-tree-loop-distribute-patterns on GNU compilers, because without
      # them gcc emits calls to memcpy, memset and sqrtf that the library never
      # wrote -- and this job omitted both. So `sh build.sh claims` passed while
      # the job asserting the same thing failed on ubuntu's real gcc. Two
      # implementations of one claim is how that happens. There is one now.
      - run: sh build.sh claims

  # Determinism is a contract, not a hope. This job runs FIVE combinations --
  # -O0 -O1 -O2 -O3 -Os, all with -ffp-contract=off -- and every one must
  # produce the pinned hashes. (The wider 20-combination sweep that includes
  # -ffp-contract=fast, where four legitimately differ, is documented in the
  # header and is not what runs here.)
  determinism:
    name: golden hashes across optimisation levels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for O in -O0 -O1 -O2 -O3 -Os; do
            echo "== $O -ffp-contract=off =="
            cc -std=c99 $O -ffp-contract=off -I. -o build_audit tests/audit.c -lm 2>/dev/null || \
              { mkdir -p build; cc -std=c99 $O -ffp-contract=off -I. -o build_audit tests/audit.c -lm; }
            # NOT `./build_audit | grep ...`: audit.c prints the same label text on
            # PASS and on FAIL, and a pipe hands the exit status to grep, so that
            # form matched a FAILING golden hash and reported success.
            ./build_audit > audit.out || { cat audit.out; exit 1; }
            grep -qE '^PASS  golden blob' audit.out || { cat audit.out; exit 1; }
          done
