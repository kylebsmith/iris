name: release

# When a tag v<version> is pushed: every file must name that version, the
# CHANGELOG.md heading and CITATION.cff's date-released must give the release
# date, and the whole of ci.yml must pass on the tagged commit.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  version:
    name: one version everywhere
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: the tag, iris.h, library.properties, CITATION.cff and CHANGELOG.md agree, with a release date
        run: sh tools/version-check.sh "$GITHUB_REF_NAME"

  ci:
    name: ci on the tagged commit
    needs: version
    uses: ./.github/workflows/ci.yml
